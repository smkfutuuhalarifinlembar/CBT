version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cbt-db
    restart: always
    environment:
      - POSTGRES_USER=ujian
      - POSTGRES_PASSWORD=rahasia
      - POSTGRES_DB=ujian_cbt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ujian -d ujian_cbt"]
      interval: 10s
      timeout: 5s
      retries: 5

  cbt-exam-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cbt-exam-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://ujian:rahasia@db:5432/ujian_cbt
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
